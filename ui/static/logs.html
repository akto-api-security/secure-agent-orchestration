<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Security Lab -- Live Logs</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #0d1117; color: #c9d1d9; }
  header { background: #161b22; border-bottom: 1px solid #30363d; }
  header h1 { color: #c9d1d9; }
  main { max-width: none; padding: 12px 20px; }
  #log-pane {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
    height: calc(100vh - 100px);
    overflow-y: auto;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
  }
  .log-line { padding: 2px 0; border-bottom: 1px solid #161b22; }
  .log-line .tag {
    display: inline-block;
    min-width: 220px;
    font-weight: 700;
    margin-right: 8px;
  }
  .log-line .ts { color: #8b949e; margin-right: 8px; }
  .log-line.error { color: #f85149; }
  .tag-orchestrator { color: #79c0ff; }
  .tag-delegated-agent-api-security { color: #56d364; }
  .tag-delegated-agent-agentic-security { color: #d2a8ff; }
  .tag-approval-agent { color: #f2cc60; }
  .tag-interceptor { color: #ff9492; }
  #toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: #8b949e; font-size: 13px; }
  #toolbar button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>Live Logs -- Agent Security Lab</h1>
</header>
<main>
  <div id="toolbar">
    <span id="poll-status">connecting...</span>
    <button id="autoscroll-btn">Autoscroll: ON</button>
    <button id="clear-btn">Clear</button>
    <span>Polling every 4s across: <span id="components"></span></span>
  </div>
  <div id="log-pane"></div>
</main>
<script>
const params = new URLSearchParams(location.search);
let sinceMs = parseInt(params.get("since") || String(Date.now() - 5 * 60 * 1000), 10);
let autoscroll = true;
const seen = new Set();
const pane = document.getElementById("log-pane");

function classFor(component) {
  return "tag-" + component.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/-+$/, "");
}

function render(entries) {
  for (const e of entries) {
    const key = e.ts + "|" + e.component + "|" + e.message;
    if (seen.has(key)) continue;
    seen.add(key);

    const line = document.createElement("div");
    line.className = "log-line" + (e.error ? " error" : "");
    const ts = new Date(e.ts).toLocaleTimeString();
    line.innerHTML =
      `<span class="ts">${ts}</span>` +
      `<span class="tag ${classFor(e.component)}">[${e.component}]</span>` +
      `<span class="msg"></span>`;
    line.querySelector(".msg").textContent = e.message;
    pane.appendChild(line);
  }
  if (autoscroll) pane.scrollTop = pane.scrollHeight;
}

async function poll() {
  try {
    const res = await fetch(`/api/logs?since_ms=${sinceMs}`);
    const data = await res.json();
    document.getElementById("components").textContent = (data.components || []).join(", ");
    render(data.logs || []);
    if (data.logs && data.logs.length) {
      sinceMs = Math.max(...data.logs.map((e) => e.ts)) + 1;
    }
    document.getElementById("poll-status").textContent = "live";
  } catch (err) {
    document.getElementById("poll-status").textContent = "poll failed: " + err;
  }
}

document.getElementById("autoscroll-btn").addEventListener("click", (e) => {
  autoscroll = !autoscroll;
  e.target.textContent = "Autoscroll: " + (autoscroll ? "ON" : "OFF");
});
document.getElementById("clear-btn").addEventListener("click", () => {
  pane.innerHTML = "";
  seen.clear();
});

poll();
setInterval(poll, 4000);
</script>
</body>
</html>
