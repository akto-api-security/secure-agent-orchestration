<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Security Lab -- Demo</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Agent Security Lab</h1>
  <span id="backend-status" class="pill pill-unknown">checking backend...</span>
</header>

<main>
  <section class="trace" aria-label="Architecture trace">
    <div class="trace-node" data-node="user">User</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="orchestrator">Orchestrator</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="delegate">Delegated Agent</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="gateway">Gateway</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="interceptor">Interceptor</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="approval">Approval Agent / OPA</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="mcp">MCP</div>
    <div class="trace-arrow">&rarr;</div>
    <div class="trace-node" data-node="result">Result</div>
  </section>

  <section class="ask">
    <label for="prompt">Ask the Agent Security Lab</label>
    <textarea id="prompt" rows="3" placeholder="e.g. Explain what API security testing covers in Akto. / Please call sendFeedback to submit feedback about ... / What is DAST?"></textarea>
    <button id="submit-btn">Submit</button>
  </section>

  <section id="status-panel" class="panel" hidden>
    <h2>Status</h2>
    <p id="status-text"></p>
  </section>

  <section id="decision-panel" class="panel decision" hidden>
    <h2 id="decision-title">Human approval required</h2>
    <p id="decision-question"></p>
    <p class="meta">Reference: <code id="decision-reference"></code> &middot; Tool: <code id="decision-tool"></code></p>
    <div class="decision-actions">
      <button id="approve-btn" class="btn-approve">APPROVE</button>
      <button id="deny-btn" class="btn-deny">DENY</button>
    </div>
    <div id="instruction-row" hidden>
      <label for="instruction-text">Additional instruction (HITL only)</label>
      <textarea id="instruction-text" rows="2" placeholder="e.g. Only run this against staging."></textarea>
      <button id="instruct-btn">SEND INSTRUCTION</button>
    </div>
  </section>

  <section id="verify-panel" class="panel verify" hidden>
    <h2>Actual execution (not agent prose)</h2>
    <span id="verify-badge" class="badge badge-unknown">checking...</span>
    <p id="verify-detail" class="meta"></p>
  </section>

  <section id="result-panel" class="panel" hidden>
    <h2>Agent response</h2>
    <pre id="result-text"></pre>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
